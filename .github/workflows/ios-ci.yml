name: ios-ci

on:
  pull_request:
    paths:
      - "ios/**"
      - "docs/api/fixtures/**"
      - ".github/workflows/ios-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: ios
          bundler-cache: true
      - name: Release rule tests
        run: |
          bundle exec ruby fastlane/test/testflight_release_test.rb
          bundle exec ruby fastlane/test/verify_project_test.rb
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
          bundle exec ruby fastlane/verify_project.rb
      - name: Unit tests
        run: |
          DEST=$(xcrun simctl list devices available -j | python3 -c 'import json,sys
          d=json.load(sys.stdin)["devices"]
          rts=sorted([k for k in d if "iOS" in k], key=lambda k: [int(x) for x in k.split("iOS-")[1].split("-")])
          dev=[x for x in d[rts[-1]] if x["name"].startswith("iPhone")][0]
          print("id="+dev["udid"])')
          xcodebuild -project HealthAssistant.xcodeproj -scheme HealthAssistant -destination "platform=iOS Simulator,$DEST" \
            -configuration Debug CODE_SIGNING_ALLOWED=NO test
