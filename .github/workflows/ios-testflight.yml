name: ios-testflight

# Manual only. A push or a pull request never uploads a build.
# # Every merge to main that changes the app builds and uploads one TestFlight
# build (ADR 0006). workflow_dispatch: release again, or recheck a build.
on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "docs/api/fixtures/**"
      - ".github/workflows/ios-testflight.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "release = build main and upload once; recheck = read-only check of an uploaded build"
        type: choice
        options: [release, recheck]
        default: release
      build_number:
        description: "recheck: the build number to check"
        type: string
        required: false
      add_build_to_group:
        description: "recheck: add the processed build to the internal group"
        type: boolean
        default: false

permissions:
  contents: read

# Runs are serial. A running release is never cancelled.
concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 120
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      FASTLANE_SKIP_DOCS: "1"
      FASTLANE_OPT_OUT_USAGE: "1"
      FASTLANE_HIDE_CHANGELOG: "1"
      MODE: ${{ inputs.mode || 'release' }}
      BUILD_NUMBER: ${{ inputs.build_number }}
      ADD_BUILD_TO_GROUP: ${{ inputs.add_build_to_group }}
    defaults:
      run:
        working-directory: ios
    steps:
      - name: Check ref
        working-directory: .
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Run this workflow from main, not $GITHUB_REF."
            exit 1
          fi
          echo "Source: main at $GITHUB_SHA"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Confirm checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: ruby/setup-ruby@v1
        with:
          working-directory: ios
          bundler-cache: true

      - name: Release rule tests
        run: |
          bundle exec ruby fastlane/test/testflight_release_test.rb
          bundle exec ruby fastlane/test/verify_project_test.rb

      - name: Generate Xcode project
        if: env.MODE == 'release'
        run: |
          brew install xcodegen
          xcodegen generate
          bundle exec ruby fastlane/verify_project.rb

      - name: Fastlane
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
          TESTFLIGHT_INTERNAL_GROUP: ${{ vars.TESTFLIGHT_INTERNAL_GROUP }}
        run: |
          export HA_SIGNING_DIR="$RUNNER_TEMP/ha-signing"
          export HA_SUMMARY_PATH="$RUNNER_TEMP/ha-summary/summary.json"
          export HA_SOURCE_SHA="$GITHUB_SHA"
          export HA_RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ "$MODE" = "release" ]; then
            bundle exec fastlane ios release
          else
            bundle exec fastlane ios recheck build_number:"$BUILD_NUMBER" add_build_to_group:"$ADD_BUILD_TO_GROUP"
          fi

      - name: Summary
        if: always()
        run: |
          summary="$RUNNER_TEMP/ha-summary/summary.md"
          if [ -f "$summary" ]; then
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '## iOS TestFlight\n\nThe run stopped before Fastlane started. Source: main at %s. Nothing was uploaded.\n' \
              "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$HOME/Library/Keychains/health-assistant-release.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/ha-signing"
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision
          rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/"*.mobileprovision
